# template: คัดลอกไป ~/.cloudflared/harnkan-config.yml แล้วแทน <TUNNEL_UUID>, __HOME__ และ hostname
# แยกไฟล์จาก ~/.cloudflared/config.yml ของบริการอื่นเสมอ · ใช้ 127.0.0.1 ไม่ใช้ localhost (localhost อาจไปที่ ::1 ซึ่ง server ไม่ได้ฟัง)
# เปิดเฉพาะ path ที่ต้องใช้จากภายนอก ที่เหลือ 404 (server bind 127.0.0.1 เท่านั้น)
tunnel: <TUNNEL_UUID>
credentials-file: __HOME__/.cloudflared/<TUNNEL_UUID>.json
ingress:
  - hostname: harnkan.example.com
    path: ^/(webhook|healthz|qr/.*|app/.*|api/.*|domain/.*)$
    service: http://127.0.0.1:8787
  - service: http_status:404

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หารกัน · เดโม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/app/app.css">
  <link rel="stylesheet" href="./demo.css">
  <script type="importmap">{ "imports": { "#domain/": "../src/domain/" } }</script>
</head>
<body>
  <div class="demo-bar" role="note"><b>โหมดเดโม ข้อมูลสมมติ</b> · เก็บในเบราว์เซอร์นี้เท่านั้น
    <button type="button" id="reset" class="secondary">เริ่มใหม่</button></div>
  <div class="demo-switch" role="tablist" aria-label="สลับมุมมอง">
    <button type="button" role="tab" id="show-chat" aria-selected="true">💬 แชท LINE จำลอง</button>
    <button type="button" role="tab" id="show-app" aria-selected="false">📱 mini app</button>
  </div>
  <section id="chat" aria-label="แชทจำลอง">
    <div class="chat-head" data-testid="chat-net"></div>
    <ol class="chat-log" id="log" aria-live="polite"></ol>
    <div class="slips" role="group" aria-label="ส่งสลิปสังเคราะห์">
      <button type="button" class="secondary" data-slip="slip-7eleven">🧾 สลิป 7-Eleven</button>
      <button type="button" class="secondary" data-slip="slip-sunscreen">🧾 ใบเสร็จครีมกันแดด</button>
      <button type="button" class="secondary" data-slip="slip-settle">💸 สลิปโอน ฿347.50</button>
    </div>
    <form id="say" class="chat-input">
      <div class="chips" role="group" aria-label="พิมพ์ในนามของ">
        <button type="button" class="chip p0" data-as="1" aria-pressed="true">เอ</button>
        <button type="button" class="chip p1" data-as="2" aria-pressed="false">บี</button>
      </div>
      <label for="msg" class="sr">ข้อความ</label>
      <input id="msg" autocomplete="off" placeholder='พิมพ์ เช่น "กาแฟ 90" หรือ "สรุป"'>
      <button type="submit">ส่ง</button>
    </form>
  </section>
  <main id="app" hidden aria-live="polite"></main>
  <nav class="tabs" hidden aria-label="เมนูหลัก">
    <a href="#/" data-tab="today">วันนี้</a>
    <a href="#/history" data-tab="history">ประวัติ</a>
    <a href="#/settle" data-tab="settle">เคลียร์ยอด</a>
    <a href="#/settings" data-tab="settings">ตั้งค่า</a>
  </nav>
  <script type="module" src="./demo.js"></script>
</body>
</html>
